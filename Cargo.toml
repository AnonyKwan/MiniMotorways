[package]
name = "little-lanes-core"
version = "0.2.0"
edition = "2021"
description = "Deterministic simulation core of Little Lanes, compiled to WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.test]
opt-level = 2
