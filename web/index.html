<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Little Lanes</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #d6e8eb; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  </style>
</head>
<body>
  <canvas id="glcanvas" tabindex="1"></canvas>
  <script src="gl.js"></script>
  <script>
    // Little Lanes browser services: saved scores (localStorage) and generated sound (Web Audio).
    //
    // All sound is made here from oscillators and noise; nothing is recorded. The music is a
    // small generative score that the game conducts: a beat clock, a bright major key per map
    // walking through a warm four-chord loop, soft electric-piano chords that fill the quiet
    // start, and one plucked voice per busy colour that only plays notes that sit well over the
    // current chord. Player sounds use the key's major pentatonic and land on the beat grid, so
    // building always plays along in tune.
    (function () {
      var ctx = null, bus = null;
      function audio() {
        if (!ctx) {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          ctx = new AC();
          setup();
        }
        if (ctx.state === "suspended") ctx.resume();
        return ctx;
      }
      // Browsers only allow sound after a user gesture.
      ["pointerdown", "keydown", "touchstart"].forEach(function (e) {
        window.addEventListener(e, function () { audio(); }, { passive: true });
      });

      // ---- Mixer: music and effects buses, a gentle compressor and a little room ----------
      function setup() {
        var a = ctx;
        var comp = a.createDynamicsCompressor();
        comp.threshold.value = -20; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.25;
        var master = a.createGain(); master.gain.value = 2.2;
        comp.connect(master); master.connect(a.destination);
        var verb = a.createConvolver();
        var len = Math.floor(a.sampleRate * 1.2), ir = a.createBuffer(2, len, a.sampleRate);
        for (var ch = 0; ch < 2; ch++) {
          var d = ir.getChannelData(ch);
          for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 4);
        }
        verb.buffer = ir;
        var verbGain = a.createGain(); verbGain.gain.value = 0.16;
        verb.connect(verbGain); verbGain.connect(comp);
        var music = a.createGain(); music.gain.value = 0;
        var sfx = a.createGain(); sfx.gain.value = 1;
        music.connect(comp); sfx.connect(comp);
        var send = a.createGain(); send.gain.value = 1; send.connect(verb);
        var noise = a.createBuffer(1, a.sampleRate * 2, a.sampleRate), nd = noise.getChannelData(0), last = 0;
        for (var j = 0; j < nd.length; j++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; nd[j] = last * 3.5; }
        bus = { music: music, sfx: sfx, send: send, noise: noise };
        // A level meter, read by automated checks through window.llAudioLevel().
        var meter = a.createAnalyser(); meter.fftSize = 2048; master.connect(meter);
        window.llAudioOut = master;
        window.llAudioLevel = function () {
          var buf = new Float32Array(meter.fftSize); meter.getFloatTimeDomainData(buf);
          var sum = 0; for (var i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
          return Math.sqrt(sum / buf.length);
        };
        startHum();
        setInterval(schedule, 25);
      }

      // ---- Harmony --------------------------------------------------------------------
      // Major keys only: C, F and D, one per map. Sound effects use the major pentatonic,
      // which has no clashing notes; the music walks a loop of major-key chords.
      var ROOTS = [60, 65, 62];
      var PENT = [0, 2, 4, 7, 9], MAJ = [0, 2, 4, 5, 7, 9, 11];
      // Chord loops by scale degree (0 = I, 3 = IV, 4 = V, 5 = vi): warm pop progressions.
      var PROGS = [[0, 4, 5, 3], [0, 5, 3, 4], [3, 0, 4, 0], [0, 3, 0, 4], [5, 3, 0, 4]];
      var scale = { root: 60, pcs: PENT }, prog = PROGS[0], chordIdx = 0;
      function key() { return ROOTS[state.map]; }
      function nextScale() {
        scale = { root: key(), pcs: PENT };
        var p; do { p = PROGS[Math.floor(Math.random() * PROGS.length)]; } while (p === prog);
        prog = p; chordIdx = 0;
      }
      // The current chord as MIDI notes around middle C (root, third, fifth).
      function chord() {
        var d = prog[chordIdx % prog.length];
        return [0, 2, 4].map(function (k) { var i = d + k; return key() + MAJ[i % 7] + 12 * Math.floor(i / 7); });
      }
      // Notes that sound good over the chord: its own tones plus the pentatonic notes that sit
      // at least a whole tone from every chord tone. Returned across two octaves, low to high.
      function melodyNotes() {
        var c = chord().map(function (m) { return m % 12; }), outN = [];
        for (var m = key(); m < key() + 24; m++) {
          var pc = m % 12, inPent = PENT.indexOf((pc - key() % 12 + 12) % 12) >= 0;
          var isChord = c.indexOf(pc) >= 0;
          var clash = c.some(function (q) { var dd = Math.abs(pc - q); dd = Math.min(dd, 12 - dd); return dd === 1; });
          if (isChord || (inPent && !clash)) outN.push(m);
        }
        return outN;
      }
      // MIDI note for scale degree `deg` (any integer) above `base` octave.
      function note(deg, octave) {
        var n = scale.pcs.length, o = Math.floor(deg / n), i = ((deg % n) + n) % n;
        return scale.root + scale.pcs[i] + 12 * (o + (octave || 0));
      }
      function hz(m) { return 440 * Math.pow(2, (m - 69) / 12); }

      // ---- Voices ---------------------------------------------------------------------
      function out(gain, pan, wet) {
        var a = ctx, g = a.createGain(), p = a.createStereoPanner ? a.createStereoPanner() : null;
        g.gain.value = gain;
        if (p) { p.pan.value = pan || 0; g.connect(p); p.connect(wet.dest); } else g.connect(wet.dest);
        if (wet.send) { var s = a.createGain(); s.gain.value = wet.send; g.connect(s); s.connect(bus.send); }
        return g;
      }
      // A soft plucked note: triangle plus a quiet octave, filtered, quick attack, long fade.
      function pluck(m, t, dur, vol, pan, dest, bright) {
        var a = ctx, o1 = a.createOscillator(), o2 = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
        o1.type = "triangle"; o2.type = "sine";
        o1.frequency.value = hz(m); o2.frequency.value = hz(m + 12);
        o1.detune.value = (Math.random() - 0.5) * 6;
        f.type = "lowpass"; f.frequency.setValueAtTime(bright || 2400, t); f.frequency.exponentialRampToValueAtTime(500, t + dur);
        var o2g = a.createGain(); o2g.gain.value = 0.25;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o1.connect(f); o2.connect(o2g); o2g.connect(f); f.connect(g);
        g.connect(out(1, pan, { dest: dest, send: 0.5 }));
        o1.start(t); o2.start(t); o1.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
      }
      // A small bell: sine with an inharmonic partial, for deliveries.
      function bell(m, t, vol, pan) {
        var a = ctx, dest = bus.sfx;
        [[1, 1, 1.4], [2.76, 0.25, 0.5], [5.4, 0.08, 0.25]].forEach(function (pt) {
          var o = a.createOscillator(), g = a.createGain();
          o.type = "sine"; o.frequency.value = hz(m) * pt[0];
          g.gain.setValueAtTime(0.0001, t);
          g.gain.exponentialRampToValueAtTime(vol * pt[1], t + 0.005);
          g.gain.exponentialRampToValueAtTime(0.0001, t + pt[2]);
          o.connect(g); g.connect(out(1, pan, { dest: dest, send: 0.6 }));
          o.start(t); o.stop(t + pt[2] + 0.05);
        });
      }
      // A soft electric-piano chord: sine tones with a gentle bell on top, slow fade, no detune.
      function pad(ms, t, dur, vol) {
        var a = ctx;
        ms.forEach(function (m, k) {
          [[1, 1], [2, 0.18]].forEach(function (pt) {
            var o = a.createOscillator(), g = a.createGain();
            o.type = "sine"; o.frequency.value = hz(m) * pt[0];
            var v = vol * pt[1] / ms.length;
            g.gain.setValueAtTime(0.0001, t + k * 0.025);
            g.gain.exponentialRampToValueAtTime(v, t + k * 0.025 + 0.02);
            g.gain.exponentialRampToValueAtTime(v * 0.4, t + dur * 0.35);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            o.connect(g); g.connect(out(1, (k - 1) * 0.3, { dest: bus.music, send: 0.35 }));
            o.start(t); o.stop(t + dur + 0.05);
          });
        });
      }
      // A light woodblock tick, for keeping time when a shop is getting busy.
      function tick2(t, vol) {
        var a = ctx, o = a.createOscillator(), g = a.createGain();
        o.type = "sine"; o.frequency.setValueAtTime(hz(key() + 31), t);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol, t + 0.003);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
        o.connect(g); g.connect(out(1, 0.25, { dest: bus.music, send: 0.1 }));
        o.start(t); o.stop(t + 0.1);
      }
      function noiseHit(t, vol, freq, dur) {
        var a = ctx, src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
        src.buffer = bus.noise; f.type = "bandpass"; f.frequency.value = freq; f.Q.value = 1.2;
        g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        src.connect(f); f.connect(g); g.connect(bus.music);
        src.start(t, Math.random() * 1.5); src.stop(t + dur + 0.05);
      }
      // A low hum of traffic under everything, louder with more cars moving, wobbling slowly.
      var hum = null;
      function startHum() {
        var a = ctx, src = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain(), lfo = a.createOscillator(), lg = a.createGain();
        src.buffer = bus.noise; src.loop = true;
        f.type = "lowpass"; f.frequency.value = 260;
        g.gain.value = 0;
        lfo.frequency.value = 0.23; lg.gain.value = 0.004; lfo.connect(lg); lg.connect(g.gain);
        src.connect(f); f.connect(g); g.connect(bus.sfx);
        src.start(); lfo.start();
        hum = g;
      }

      // ---- The game's state, sent every frame -------------------------------------------
      var state = { cars: 0, colors: 0, week: 1, danger: 0, mode: 0, map: 0 };
      var lastWeek = 1, wantChange = false;

      // ---- Beat clock (a short look-ahead scheduler) ------------------------------------
      var BPM = 92, STEP = 60 / BPM / 4; // sixteenth notes
      var nextStep = 0, step = 0;
      var PATTERNS = [[4, 4, 4, 4], [6, 6, 4], [3, 3, 2, 3, 3, 2], [8, 8], [5, 5, 6], [4, 2, 2, 4, 4]];
      var voices = [];
      for (var v = 0; v < 6; v++) voices.push({ pat: PATTERNS[v], at: 0, idx: 0, pos: [2, 6, 4, 8, 1, 7][v], pan: [-0.5, 0.5, -0.2, 0.3, -0.6, 0.6][v] });
      function schedule() {
        if (!ctx || ctx.state !== "running") return;
        var a = ctx, now = a.currentTime;
        var playing = state.mode === 1, held = state.mode === 2, muted = state.mode < 0;
        // Music level: full while playing, softer when held, gone when muted.
        var target = muted ? 0 : held ? 0.45 : state.mode === 3 ? 0.35 : 0.9;
        bus.music.gain.setTargetAtTime(target, now, 0.4);
        bus.sfx.gain.setTargetAtTime(muted ? 0 : 1, now, 0.05);
        if (hum) hum.gain.setTargetAtTime(muted || !playing ? 0 : Math.min(state.cars / 14, 1) * 0.012, now, 0.8);
        if (nextStep < now) nextStep = now + 0.05;
        while (nextStep < now + 0.12) { tick(nextStep, step, playing || held); nextStep += STEP; step++; }
      }
      function tick(t, st, inGame) {
        var bar = st % 16 === 0, beat = st % 4 === 0;
        if (bar) {
          if (state.week !== lastWeek) { lastWeek = state.week; wantChange = true; }
          if (scale.root !== key()) wantChange = true;
          if (st > 0) chordIdx++;
          if (wantChange || chordIdx >= prog.length * 2) { nextScale(); wantChange = false; }
        }
        var busy = state.cars, ch = chord();
        // Chords: one per bar. Always there on the title screen; in a game they fill the quiet
        // start and soften as cars take over.
        if (bar) {
          var padVol = inGame ? 0.11 * Math.max(0.35, 1 - busy / 12) : 0.12;
          pad([ch[0] - 12, ch[1] - 12, ch[2] - 12], t, STEP * 16, padVol);
          if (!inGame) pad([ch[1], ch[2]], t + STEP * 8, STEP * 8, 0.05);
        }
        if (!inGame) return;
        // One plucked voice per busy colour; each gets quieter as more join in. Voices step
        // through the notes that fit the chord, mostly by small steps.
        var mel = melodyNotes();
        var active = busy === 0 ? 0 : Math.min(state.colors, 1 + Math.floor(busy / 3));
        for (var i = 0; i < active; i++) {
          var vc = voices[i];
          if (st >= vc.at) {
            var stepLen = vc.pat[vc.idx % vc.pat.length]; vc.idx++;
            vc.at = st + stepLen;
            vc.pos += [0, 1, -1, 1, -1, 2, -2][Math.floor(Math.random() * 7)];
            vc.pos = Math.max(0, Math.min(mel.length - 1, vc.pos));
            var vol = 0.07 / Math.sqrt(active) * (0.8 + Math.random() * 0.3);
            pluck(mel[vc.pos], t, 0.8, vol, vc.pan, bus.music, 3000);
          }
        }
        for (var k = active; k < voices.length; k++) voices[k].at = st;
        // A round bass on the chord root once the town has a few cars about.
        if (busy >= 2 && state.week >= 2 && (bar || st % 16 === 10)) pluck(ch[0] - 24, t, 1.2, 0.07, 0, bus.music, 900);
        // Very quiet brushed off-beats when the town is busy.
        if (busy >= 6 && st % 4 === 2) noiseHit(t, 0.010 + Math.min(busy, 20) * 0.0005, 7000, 0.05);
        // When a shop is close to overflowing, a light woodblock keeps time, quicker as it
        // gets worse: a nudge to look, not a scare.
        if (state.danger >= 40 && state.mode === 1) {
          var d = state.danger / 100;
          if (st % 4 === 2 || (state.danger >= 75 && st % 2 === 1)) tick2(t, 0.02 + 0.04 * d);
        }
      }
      // Effects land on the next sixteenth so they play along with the music.
      function grid(a) { return nextStep > a.currentTime ? nextStep : a.currentTime + 0.01; }

      // ---- Sound effects --------------------------------------------------------------
      var roadRun = 0, roadAt = 0, tripRun = 0, tripAt = 0;
      function sfx(kind) {
        var a = audio(); if (!a || !bus) return;
        var t = grid(a), now = a.currentTime;
        switch (kind) {
          case 0: // a car delivered: a bell that climbs while deliveries keep coming
            tripRun = now - tripAt < 3 ? tripRun + 1 : 0; tripAt = now;
            bell(note(4 + (tripRun % 8), 1), t, 0.07, (Math.random() - 0.5) * 0.6); break;
          case 1: // a road tile: plucks walk up the scale along a stroke
            roadRun = now - roadAt < 0.7 ? roadRun + 1 : 0; roadAt = now;
            pluck(note(roadRun % 10, 0), t, 0.35, 0.05, 0, bus.sfx, 1800); break;
          case 7: // erasing: the same, walking down and duller
            roadRun = now - roadAt < 0.7 ? roadRun + 1 : 0; roadAt = now;
            pluck(note(4 - (roadRun % 8), -1), t, 0.25, 0.05, 0, bus.sfx, 900); break;
          case 2: // a new week and its upgrade card: a gentle two-note rise
            pluck(note(0, 0), t, 1.2, 0.08, -0.2, bus.sfx); pluck(note(4, 0), t + STEP * 2, 1.4, 0.08, 0.2, bus.sfx);
            pluck(note(7, 0), t + STEP * 4, 1.6, 0.06, 0, bus.sfx); wantChange = true; break;
          case 3: // warning: a soft falling pair, an "uh-oh" rather than an alarm
            pluck(note(4, 0), t, 0.5, 0.08, 0, bus.sfx, 1600); pluck(note(2, 0), t + STEP * 2, 0.7, 0.08, 0, bus.sfx, 1400); break;
          case 4: // something new appears, or a junction is placed: a small mallet pair
            pluck(note(2, 1), t, 0.4, 0.05, 0.3, bus.sfx, 3000); pluck(note(4, 1), t + STEP, 0.5, 0.04, 0.3, bus.sfx, 3000); break;
          case 5: // game over: the tune settles home slowly
            [4, 3, 1, 0].forEach(function (d, i) { pluck(note(d, 0), t + i * STEP * 3, 1.6, 0.09, 0, bus.sfx, 1400); }); break;
          case 6: // UI click
            pluck(note(4, 1), a.currentTime, 0.12, 0.035, 0, bus.sfx, 3500); break;
          case 8: // a horn: two reedy notes, a touch out of tune, on the beat
            var m = note(2, 0);
            [0, 0.07].forEach(function (off) {
              var o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
              o.type = "sawtooth"; o.frequency.value = hz(m + (off ? 4 : 0));
              o.detune.value = 0;
              f.type = "lowpass"; f.frequency.value = 1300;
              g.gain.setValueAtTime(0.0001, t);
              g.gain.exponentialRampToValueAtTime(0.03, t + 0.02);
              g.gain.setValueAtTime(0.03, t + 0.12);
              g.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
              o.connect(f); f.connect(g); g.connect(out(1, (Math.random() - 0.5) * 0.8, { dest: bus.sfx, send: 0.3 }));
              o.start(t); o.stop(t + 0.25);
            });
            break;
        }
      }
      miniquad_add_plugin({
        name: "little_lanes",
        version: 1,
        register_plugin: function (importObject) {
          importObject.env.ll_store_get = function (k) {
            try { return parseInt(window.localStorage.getItem("little_lanes_" + k) || "0", 10) || 0; } catch (e) { return 0; }
          };
          importObject.env.ll_store_set = function (k, v) {
            try { window.localStorage.setItem("little_lanes_" + k, String(v)); } catch (e) {}
          };
          importObject.env.ll_beep = function (kind) {
            try { sfx(kind); } catch (e) {}
          };
          importObject.env.ll_music = function (cars, colors, week, danger, mode, map) {
            state.cars = cars; state.colors = colors; state.week = week; state.danger = danger;
            state.mode = mode; state.map = Math.max(0, Math.min(2, map));
          };
        }
      });
    })();
    load("little-lanes.wasm");
  </script>
</body>
</html>
