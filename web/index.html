<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Little Lanes</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #d6e8eb; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; outline: none; }
  </style>
</head>
<body>
  <canvas id="glcanvas" tabindex="1"></canvas>
  <script src="gl.js"></script>
  <script>
    // Little Lanes browser services: saved scores (localStorage) and generated sound (Web Audio).
    (function () {
      var ctx = null;
      function audio() {
        if (!ctx) {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          ctx = new AC();
        }
        if (ctx.state === "suspended") ctx.resume();
        return ctx;
      }
      // Browsers only allow sound after a user gesture.
      ["pointerdown", "keydown", "touchstart"].forEach(function (e) {
        window.addEventListener(e, function () { audio(); }, { passive: true });
      });
      function tone(freq, start, dur, type, vol) {
        var a = audio(); if (!a) return;
        var o = a.createOscillator(), g = a.createGain();
        o.type = type || "sine";
        o.frequency.value = freq;
        var t = a.currentTime + start;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(a.destination);
        o.start(t); o.stop(t + dur + 0.02);
      }
      var sounds = [
        function () { tone(880, 0, 0.18, "sine", 0.08); tone(1320, 0.07, 0.22, "sine", 0.06); },      // trip
        function () { tone(520, 0, 0.05, "triangle", 0.04); },                                         // road
        function () { tone(660, 0, 0.12); tone(880, 0.08, 0.12); tone(1100, 0.16, 0.2); },             // pick
        function () { tone(220, 0, 0.25, "triangle", 0.12); tone(196, 0.22, 0.3, "triangle", 0.12); }, // warning
        function () { tone(400, 0, 0.08, "sine", 0.1); tone(800, 0.05, 0.12, "sine", 0.07); },        // pop
        function () { tone(440, 0, 0.3); tone(330, 0.25, 0.3); tone(220, 0.5, 0.6); },                 // game over
        function () { tone(700, 0, 0.04, "triangle", 0.05); }                                          // click
      ];
      miniquad_add_plugin({
        name: "little_lanes",
        version: 1,
        register_plugin: function (importObject) {
          importObject.env.ll_store_get = function (k) {
            try { return parseInt(window.localStorage.getItem("little_lanes_" + k) || "0", 10) || 0; } catch (e) { return 0; }
          };
          importObject.env.ll_store_set = function (k, v) {
            try { window.localStorage.setItem("little_lanes_" + k, String(v)); } catch (e) {}
          };
          importObject.env.ll_beep = function (kind) {
            try { if (sounds[kind]) sounds[kind](); } catch (e) {}
          };
        }
      });
    })();
    load("little-lanes.wasm");
  </script>
</body>
</html>
